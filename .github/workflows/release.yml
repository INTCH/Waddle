name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # the default also installs the legacy "tools" package, which the SDK repository no longer has
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$version\"" app/build.gradle.kts; then
            echo "Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned build." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify the signature and collect the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "No signed release APK was produced (check the signing secrets)." >&2
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/Waddle-$VERSION.apk"
          (cd dist && sha256sum "Waddle-$VERSION.apk" > "Waddle-$VERSION.apk.sha256")

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Waddle $VERSION" \
            --generate-notes \
            "dist/Waddle-$VERSION.apk" \
            "dist/Waddle-$VERSION.apk.sha256"
